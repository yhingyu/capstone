name: household-energy-capstone

channels:
  - conda-forge

dependencies:
  # Core runtime and notebook interface
  - python=3.11
  - jupyterlab>=4,<5
  - notebook>=7,<8
  - ipykernel>=6,<7
  - nbformat>=5,<6
  - nbconvert>=7,<8

  # Data loading, cleaning, and storage
  - numpy>=1.26,<3
  - pandas>=2.2,<3
  - scipy>=1.12,<2
  - pyarrow>=15,<23
  - openpyxl>=3.1,<4

  # Visualization and EDA
  - matplotlib>=3.8,<4
  - seaborn>=0.13,<1
  - plotly>=5.20,<7

  # Statistics, time series, and machine learning
  - scikit-learn>=1.4,<2
  - statsmodels>=0.14,<1
  - xgboost>=2,<4
  - umap-learn>=0.5,<1

  # Explainability and model artifacts
  - shap>=0.45,<1
  - lime>=0.2,<1
  - joblib>=1.3,<2

  # Utilities
  - requests>=2.31,<3
  - tqdm>=4.66,<5
  - pyyaml>=6,<7

